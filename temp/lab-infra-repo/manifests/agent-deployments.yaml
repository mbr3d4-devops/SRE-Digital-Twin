apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-scripts
  namespace: ai-ops
data:
  # O Guardião: Script Python para fazer dry-run de sanity check antes do deploy
  preflight.py: |
    import os, sys, socket
    import urllib.request
    def check():
        # Valida LM Studio no Gateway do Kind
        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        if s.connect_ex(('172.18.0.1', 1234)) != 0:
            print("❌ Erro: LM Studio inacessível em 172.18.0.1:1234"); sys.exit(1)
        # Valida API do Gitea
        url = os.environ['GITEA_URL']
        try:
            req = urllib.request.urlopen(url, timeout=5)
            if req.getcode() != 200:
                print(f"❌ Erro: {url} retornou {req.getcode()}"); sys.exit(1)
        except Exception as e:
            print(f"❌ Erro de conexão com {url}: {e}"); sys.exit(1)
        print("✅ Preflight Passou! Iniciando Agentes."); sys.exit(0)
    if __name__ == "__main__": check()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-team
  namespace: ai-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-team
  template:
    metadata:
      labels:
        app: agent-team
    spec:
      initContainers:
      - name: preflight-check
        image: python:3.9-slim
        command: ['python', '/scripts/preflight.py']
        env:
        - name: GITEA_URL
          value: "http://gitea-http.gitops.svc.cluster.local:3000"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      containers:
      # 1. Orchestrator
      - name: orchestrator
        image: python:3.9-slim
        command: ["/bin/sh", "-c", "echo 'Orchestrator Ligar'; while true; do sleep 3600; done"]
        env:
        - name: LM_STUDIO_ENDPOINT
          value: "http://172.18.0.1:1234/v1"
      # 2. DevOps (Git)
      - name: devops
        image: bitnami/git:latest
        command: ["/bin/sh", "-c", "echo 'DevOps Ligar'; while true; do sleep 3600; done"]
        volumeMounts:
        - name: infra-repo
          mountPath: /app/infra-repo
        env:
        - name: GITEA_REMOTE
          value: "http://gitea-http.gitops.svc.cluster.local:3000/marcelo/target-app-infra.git"
      # 3. Auditor (Kubectl / Gatekeeper)
      - name: auditor
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c", "echo 'Auditor Ligar'; while true; do sleep 3600; done"]
        env:
        - name: AGENT_ROLE
          value: "auditor"
        - name: STACKGUARD_MODE
          value: "strict"
      # 4. Analyst (Metrics / Logs)
      - name: analyst
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c", "echo 'Analyst Ligar'; while true; do sleep 3600; done"]
        env:
        - name: AGENT_ROLE
          value: "analyst"
        - name: GRAFANA_URL
          value: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local"
      # 5. Archivist (DB / Records)
      - name: archivist
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c", "echo 'Archivist Ligar'; while true; do sleep 3600; done"]
        env:
        - name: AGENT_ROLE
          value: "archivist"
        - name: DB_HOST
          value: "postgres-db"
      volumes:
      - name: scripts
        configMap:
          name: agent-scripts
      - name: infra-repo
        hostPath:
          path: /home/marcelo/lab-infra-repo
          type: Directory

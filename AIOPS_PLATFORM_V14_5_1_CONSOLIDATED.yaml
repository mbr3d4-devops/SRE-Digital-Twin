# 4. DEPLOYMENTS (V16 SEPARATED)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  namespace: ai-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      agent: orchestrator
  template:
    metadata:
      labels:
        agent: orchestrator
    spec:
      serviceAccountName: agent-sre-sa
      containers:
      - name: main
        image: python:3.9-slim
        command: ["/bin/sh", "-c", "pip install PyYAML redis pika prometheus-client && python /app/orchestrator.py"]
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: REDIS_HOST
          value: redis-state
        - name: RABBITMQ_HOST
          value: rabbitmq
        - name: RC_URL
          value: http://rocketchat-rocketchat.communication.svc.cluster.local
        - name: RC_TOKEN
          value: 6HZCBMmq1T9PXDITSDfnFaLDpSkQC4kn2RpK6zZKIuP
        - name: RC_USER_ID
          value: 699b1b2f1cf126f19882ef67
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 8000
        volumeMounts:
        - name: scripts
          mountPath: /app
        - name: governance
          mountPath: /etc/governance
        - name: skills
          mountPath: /etc/skills
      volumes:
      - name: scripts
        configMap:
          name: agent-scripts
      - name: governance
        configMap:
          name: agent-governance
      - name: skills
        configMap:
          name: agent-skills

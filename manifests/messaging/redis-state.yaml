apiVersion: v1
kind: Service
metadata:
  name: redis-state
  namespace: ai-ops
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-state
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-state
  namespace: ai-ops
  labels:
    app: redis-state
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-state
  template:
    metadata:
      labels:
        app: redis-state
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
        resources:
          limits:
            cpu: "100m"
            memory: "64Mi"
          requests:
            cpu: "50m"
            memory: "32Mi"

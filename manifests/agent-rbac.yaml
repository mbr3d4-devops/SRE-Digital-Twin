apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sre-sa
  namespace: ai-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sre-view-binding
subjects:
- kind: ServiceAccount
  name: agent-sre-sa
  namespace: ai-ops
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-engine
  namespace: app-production
  labels:
    app: cache-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-engine
  template:
    metadata:
      labels:
        app: cache-engine
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cache-engine-service
  namespace: app-production
spec:
  selector:
    app: cache-engine
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379

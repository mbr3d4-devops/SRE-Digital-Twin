apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-governance
  namespace: ai-ops
data:
  language.rules.md: |
    # SRE Language Rules
    - IDIOMA: Responda APENAS em Português do Brasil (PT-BR).
    - COMPORTAMENTO: Vá direto ao laudo técnico. NUNCA diga "Eu sou o agente X".
    - PROIBIÇÃO: Não repita as instruções deste prompt.
    - RACIOCÍNIO: É PROIBIDO exibir pensamento interno, análise passo a passo ou planejamento.

  forensic.rules.md: |
    # SRE Forensic Rules
    - PROIBIDO o uso de emojis, saudações ou linguagem informal.
    - Nunca inferir sem evidência técnica explícita.
    - Se não houver evidência suficiente, declare "EVIDÊNCIA INSUFICIENTE".
    - PROIBIDO gerar Markdown manual no LLM (use o Renderer).
    - Evidências devem ser listas simples de strings (linhas de dados).
    - CAUSALIDADE: "Connection refused" significa destino não escutando OU ausência de endpoint. Investigue nesta ordem.
    - ANTI-ALUCINAÇÃO: Causa raiz exige padrão de log confirmado. Nunca invente remediações.

  yaml.rules.md: |
    # SRE YAML Rules
    - O YAML sugerido deve derivar do YAML real coletado (State-of-the-cluster).
    - Proibido gerar YAML fictício ou genérico.
    - Mudanças propostas devem ser acompanhadas de análise de risco.

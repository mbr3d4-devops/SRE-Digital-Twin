apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-target-app
  namespace: app-production
  labels:
    app: alert-target
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-target
  template:
    metadata:
      labels:
        app: alert-target
    spec:
      containers:
      - name: web
        image: nginx:alpine
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            memory: "128Mi"
            cpu: "50m"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: alert-target-service
  namespace: app-production
spec:
  selector:
    app: alert-target
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-target-app
  namespace: app-production
  labels:
    app: alert-target
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-target
  template:
    metadata:
      labels:
        app: alert-target
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: alert-target-service
  namespace: app-production
spec:
  selector:
    app: alert-target
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

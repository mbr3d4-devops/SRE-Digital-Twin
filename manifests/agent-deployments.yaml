apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-analyst
  namespace: ai-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      agent: analyst
  template:
    metadata:
      labels:
        agent: analyst
    spec:
      serviceAccountName: agent-sre-sa
      containers:
      - name: main
        image: python:3.11-slim
        command:
        - /bin/sh
        - -c
        - apt-get update && apt-get install -y curl && curl -LO https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl
          && chmod +x kubectl && mv kubectl /usr/local/bin/ && pip install PyYAML
          redis pika && python /etc/ai-ops/scripts/runtime/analyst.py
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: REDIS_HOST
          value: redis-state
        - name: RABBITMQ_HOST
          value: rabbitmq
        - name: RC_URL
          value: http://rocketchat-rocketchat.communication.svc.cluster.local
        - name: RC_TOKEN
          value: 6HZCBMmq1T9PXDITSDfnFaLDpSkQC4kn2RpK6zZKIuP
        - name: RC_USER_ID
          value: 699b1b2f1cf126f19882ef67
        volumeMounts:
        - name: scripts
          mountPath: /etc/ai-ops/scripts
        - name: skills
          mountPath: /etc/ai-ops/agents
        - name: governance
          mountPath: /etc/ai-ops/governance
      volumes:
      - name: scripts
        configMap:
          name: agent-scripts
          items:
          - key: runtime.llm_gateway.py
            path: runtime/__init__.py
          - key: runtime.llm_gateway.py
            path: runtime/llm_gateway.py
          - key: runtime.messaging.py
            path: runtime/messaging.py
          - key: runtime.thread_manager.py
            path: runtime/thread_manager.py
          - key: evidence_engine.collectors.py
            path: evidence_engine/__init__.py
          - key: evidence_engine.collectors.py
            path: evidence_engine/collectors.py
          - key: evidence_engine.normalizer.py
            path: evidence_engine/normalizer.py
          - key: renderer.forensic_markdown.py
            path: renderer/__init__.py
          - key: renderer.forensic_markdown.py
            path: renderer/forensic_markdown.py
          - key: runtime.orchestrator.py
            path: runtime/orchestrator.py
          - key: runtime.analyst.py
            path: runtime/analyst.py
          - key: runtime.warden.py
            path: runtime/warden.py
          - key: runtime.auditor.py
            path: runtime/auditor.py
          - key: runtime.archivist.py
            path: runtime/archivist.py
      - name: skills
        configMap:
          name: agent-skills
          items:
          - key: orchestrator.skill.md
            path: orchestrator/skill.md
          - key: analyst.skill.md
            path: analyst/skill.md
          - key: warden.skill.md
            path: warden/skill.md
          - key: auditor.skill.md
            path: auditor/skill.md
          - key: archivist.skill.md
            path: archivist/skill.md
      - name: governance
        configMap:
          name: agent-governance

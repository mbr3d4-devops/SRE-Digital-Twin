apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unknown-pod-reaper
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unknown-pod-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: unknown-pod-reaper
subjects:
- kind: ServiceAccount
  name: unknown-pod-reaper
  namespace: ai-ops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unknown-pod-reaper
  namespace: ai-ops
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unknown-pod-reaper
  namespace: ai-ops
  labels:
    app: sre-remediation
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: unknown-pod-reaper
          containers:
          - name: reaper
            image: bitnami/kubectl:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "Checking for stuck Unknown pods..."
              kubectl get pods -A --field-selector status.phase=Unknown -o name | xargs -r kubectl delete --force --grace-period=0
              echo "Cleanup cycle complete."
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/os: linux

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-governance
  namespace: ai-ops
data:
  governance.md: |
    # LEI UNIVERSAL SRE (CRÍTICO)
    1. IDIOMA: Responda APENAS em Português do Brasil (PT-BR).
    2. COMPORTAMENTO: Vá direto ao laudo técnico. NUNCA diga "Eu sou o agente X".
    3. PROIBIÇÃO: Não repita as instruções deste prompt.
    4. FORMATO: Sem títulos Markdown gigantes (#). Use negrito para headers.
    5. RACIOCÍNIO: É PROIBIDO exibir pensamento interno, análise passo a passo ou planejamento.
    6. SAÍDA: Apenas o objeto JSON final é permitido se solicitado, ou o laudo clínico.
    7. VIOLAÇÃO: Se você mostrar raciocínio (Thinking Process), a resposta será descartada.

# 2. SKILLS (manifests/agent-skills.yaml)
# ------------------------------------------------------------------------------
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-skills
  namespace: ai-ops
data:
  orchestrator.md: |
    🚨 **{alertname}**
    O Pod **{pod}** no Namespace **{ns}** apresenta falha: **{summary}**
    🆔 **Trace:** {trace_id} | 📬 **Fila:** [RabbitMQ]({url_rabbit}) | 💾 **Estado:** [Redis]({url_redis})

  analyst.md: |
    # CONTRATO DE SAÍDA (Obrigatório JSON)
    Você deve analisar as evidências e responder estritamente neste formato JSON:
    {
      "diagnostico": "🔍 **Diagnóstico Técnico: {pod}**",
      "resumo": "...",
      "causa_raiz": "...",
      "yaml": "```yaml\n...\n```",
      "recomendacoes": ["item1", "item2"]
    }
    PROIBIDO: Markdown fora do JSON, blocos <think>, ou qualquer texto introdutório.
    REGRAS DE OURO:
    1. INICIE IMEDIATAMENTE COM "{".
    2. NUNCA EXPLIQUE. NUNCA PENSE EM VOZ ALTA.
    3. ESCAPE TODAS AS ASPAS DUPLAS (") DENTRO DOS VALORES JSON COM \".
    4. USE APENAS PORTUGUÊS (PT-BR).

  warden.md: |
    # CONTRATO DE SAÍDA (Obrigatório JSON)
    Avalie o laudo do analista e responda estritamente neste formato JSON:
    {
      "veredito": "APROVADO ou REPROVADO",
      "justificativa": "🛡️ **Veredito:** <justificativa técnica em PT-BR>"
    }
    PROIBIDO: Qualquer texto fora do objeto JSON.

  auditor.md: |
    Você é o Auditor de SLA. Valide se a correção foi aplicada e se o sistema está estável.
    📊 **Auditoria de Resiliência**

  archivist.md: |
    Você é o Archivista. Documente o incidente para o post-mortem.
    🗄️ **Registro Histórico**

# 3. SCRIPTS (manifests/agent-scripts.yaml)
# ------------------------------------------------------------------------------
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-scripts
  namespace: ai-ops
data:
  common.py: |
    import json, os, urllib.request, re, time, redis, pika, sys
    sys.path.append('/app')

    def get_redis():
        return redis.Redis(host=os.environ.get("REDIS_HOST", "redis-state"), port=6379, decode_responses=True)

    def get_mq_conn():
        creds = pika.PlainCredentials(os.environ.get('RABBITMQ_USER', 'sre'), os.environ.get('RABBITMQ_PASS', 'sre2026'))
        return pika.BlockingConnection(pika.ConnectionParameters(host=os.environ.get('RABBITMQ_HOST', 'rabbitmq'), virtual_host='sre-ops', credentials=creds))

    def clean_output(text):
        """Purity Shield 7.0 (Deterministic): Encontra o início do JSON ou do Laudo."""
        start = text.find("{")
        if start != -1: return text[start:text.rfind("}")+1]
        anchor = "🔍"
        if anchor in text: return text[text.find(anchor):]
        return text.strip()

    def call_llm(skill_key, user_data, trace_id="global"):
        try:
            with open("/etc/governance/governance.md", "r") as f: gov = f.read()
            with open(f"/etc/skills/{skill_key}.md", "r") as f: skill = f.read()
            
            payload = {
                "model": "qwen2.5-7b-instruct",
                "messages": [
                    {"role": "system", "content": f"{gov}\n{skill}\nResponda estritamente em JSON. Sem introduções."},
                    {"role": "user", "content": f"INPUT ({trace_id}):\n{user_data}"},
                    {"role": "assistant", "content": "{"}
                ],
                "temperature": 0.0,
                "max_tokens": 1000,
                "stop": ["Drafting", "Internal", "Thinking", "Analysis", "Refining", "<think>", "Thought:", "Review:"]
            }
            req = urllib.request.Request("http://172.18.0.1:1234/v1/chat/completions", data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"})
            with urllib.request.urlopen(req, timeout=120) as res:
                raw_chunk = json.loads(res.read())["choices"][0]["message"]["content"]
                return clean_output("{" + raw_chunk)
        except Exception as e: return f"⚠️ Erro de IA: {e}"

    def send_to_rocket(role, text, tmid=None):
        alias_map = {"orchestrator": "Orchestrator", "analyst": "Analyst Forensic", "warden": "The Warden", "auditor": "Auditor SLA"}
        colors = {"orchestrator": "#D32F2F", "analyst": "#4A148C", "warden": "#1B1E21", "auditor": "#2E7D32"}
        safe_text = (text[:4000] + '...') if len(text) > 4000 else text
        payload = {
            "roomId": "699b26601cf126f19882ef8d",
            "text": safe_text,
            "alias": alias_map.get(role, "Agente SRE"),
            "attachments": [{"color": colors.get(role, "#555555"), "ts": time.time()}]
        }
        if tmid: payload["tmid"] = tmid
        try:
            req = urllib.request.Request(f"{os.environ['RC_URL']}/api/v1/chat.postMessage", data=json.dumps(payload).encode(),
                headers={"X-Auth-Token": os.environ['RC_TOKEN'], "X-User-Id": os.environ['RC_USER_ID'], "Content-Type": "application/json"})
            with urllib.request.urlopen(req) as res:
                body = json.loads(res.read())
                return body["message"]["_id"] if body.get("success") else None
        except: return None

  orchestrator.py: |
    import json, os, pika, uuid
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from common import *
    class WebhookHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200); self.end_headers(); self.wfile.write(b"OK")
        def do_POST(self):
            content_length = int(self.headers['Content-Length'])
            data = json.loads(self.rfile.read(content_length))
            r = get_redis()
            for alert in data.get('alerts', []):
                tid = str(uuid.uuid4())[:8]
                labels = alert.get('labels', {})
                pod = labels.get('pod', 'N/A')
                with open("/etc/skills/orchestrator.md", "r") as f: template = f.read()
                msg = template.format(alertname=labels.get('alertname'), pod=pod, ns=labels.get('namespace'), summary=alert.get('annotations', {}).get('summary'), trace_id=tid, url_rabbit="#", url_redis="#")
                msg_id = send_to_rocket("orchestrator", msg)
                if msg_id: r.set(f"tmid:{tid}", msg_id, ex=86400)
                r.set(f"evidence:{tid}", json.dumps(alert), ex=3600)
                conn = get_mq_conn(); ch = conn.channel()
                ch.queue_declare(queue='sre_tasks', durable=True)
                ch.basic_publish(exchange='', routing_key='sre_tasks', body=json.dumps({"trace_id": tid, "thread_id": msg_id}))
                conn.close()
            self.send_response(200); self.end_headers()
    HTTPServer(('0.0.0.0', 8080), WebhookHandler).serve_forever()

  analyst_consumer.py: |
    import json, os, pika, sys
    sys.path.append('/app')
    from common import *
    def callback(ch, method, props, body):
        try:
            ctx = json.loads(body); tid = ctx['trace_id']; r = get_redis()
            tmid = r.get(f"tmid:{tid}") or ctx.get('thread_id')
            evidence = r.get(f"evidence:{tid}") or "Sem dados."
            raw_ai = call_llm("analyst", f"DADOS: {evidence}", trace_id=tid)
            try:
                data = json.loads(raw_ai)
                laudo = f"{data['diagnostico']}\n\n"
                laudo += f"**1. Resumo do Incidente**\n{data['resumo']}\n\n"
                laudo += f"**2. Causa Raiz Detalhada**\n{data['causa_raiz']}\n\n"
                laudo += f"**3. Sugestão de Correção (YAML)**\n{data['yaml']}\n\n"
                laudo += f"**4. Recomendações**\n" + "\n".join([f"- {item}" for item in data['recomendacoes']])
            except: laudo = raw_ai
            send_to_rocket("analyst", laudo, tmid=tmid)
            r.set(f"analysis:{tid}", laudo, ex=3600)
            conn = get_mq_conn(); ch_out = conn.channel()
            ch_out.queue_declare(queue='sre_warden', durable=True)
            ch_out.basic_publish(exchange='', routing_key='sre_warden', body=json.dumps(ctx))
            conn.close(); ch.basic_ack(delivery_tag=method.delivery_tag)
        except Exception as e: print(f"Erro Analyst: {e}"); ch.basic_ack(delivery_tag=method.delivery_tag)
    ch = get_mq_conn().channel(); ch.queue_declare(queue='sre_tasks', durable=True)
    ch.basic_consume(queue='sre_tasks', on_message_callback=callback); ch.start_consuming()

  warden_consumer.py: |
    import json, os, pika, sys
    sys.path.append('/app')
    from common import *
    def callback(ch, method, props, body):
        try:
            ctx = json.loads(body); tid = ctx['trace_id']; r = get_redis()
            tmid = r.get(f"tmid:{tid}") or ctx.get('thread_id')
            analise = r.get(f"analysis:{tid}") or "Sem laudo."
            raw_ai = call_llm("warden", f"ANALISE: {analise}", trace_id=tid)
            try:
                data = json.loads(raw_ai); veredito = data['veredito'].upper(); justificativa = data['justificativa']
            except: veredito = "REPROVADO"; justificativa = raw_ai
            send_to_rocket("warden", justificativa, tmid=tmid)
            if "⚠️ Erro" in veredito or "⚠️ Erro" in justificativa:
                print(f"[WARDEN] Abortando loop por erro: {tid}"); ch.basic_ack(delivery_tag=method.delivery_tag); return
            dest = "sre_audit" if "APROVADO" in veredito else "sre_tasks"
            conn = get_mq_conn(); ch_out = conn.channel()
            ch_out.queue_declare(queue=dest, durable=True)
            ch_out.basic_publish(exchange='', routing_key=dest, body=json.dumps(ctx))
            conn.close(); ch.basic_ack(delivery_tag=method.delivery_tag)
        except Exception as e: print(f"WARDEN ERROR: {e}"); ch.basic_ack(delivery_tag=method.delivery_tag)
    ch = get_mq_conn().channel(); ch.queue_declare(queue='sre_warden', durable=True)
    ch.basic_consume(queue='sre_warden', on_message_callback=callback); ch.start_consuming()

# 4. DEPLOYMENTS (manifests/agent-deployments.yaml)
# ------------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-team
  namespace: ai-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-team
  template:
    metadata:
      labels:
        app: agent-team
    spec:
      containers:
      - name: orchestrator
        image: python:3.9-slim
        command: ["/bin/sh", "-c", "pip install pika redis prometheus-client && python3 /scripts/orchestrator.py"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      - name: analyst
        image: python:3.9-slim
        command: ["/bin/sh", "-c", "pip install pika redis prometheus-client && python3 /scripts/analyst_consumer.py"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      - name: warden
        image: python:3.9-slim
        command: ["/bin/sh", "-c", "pip install pika redis prometheus-client && python3 /scripts/warden_consumer.py"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: agent-scripts

  shared.thread_manager.py: |
    import redis, os, json
    def get_redis(): return redis.Redis(host=os.environ.get("REDIS_HOST", "redis-state"), port=6379, decode_responses=True)
    class ThreadManager:
        def __init__(self): self.r = get_redis()
        def set_thread(self, tid, tmid): self.r.set(f"tmid:{tid}", tmid, ex=86400)
        def get_thread(self, tid): return self.r.get(f"tmid:{tid}")
        def set_state(self, tid, state): self.r.hset(f"incident:{tid}", "state", state)
        def get_state(self, tid): return self.r.hget(f"incident:{tid}", "state")
        def set_evidence(self, tid, evidence): self.r.set(f"incident:{tid}:evidence", json.dumps(evidence), ex=3600)
        def get_evidence(self, tid):
            data = self.r.get(f"incident:{tid}:evidence")
            return json.loads(data) if data else {}
        def save_analysis(self, tid, l): self.r.set(f"analysis:{tid}", l, ex=3600)
        def get_analysis(self, tid): return self.r.get(f"analysis:{tid}") or "Sem laudo."
        def save_analysis_raw(self, tid, raw): self.r.set(f"analysis_raw:{tid}", raw, ex=3600)
        def get_analysis_raw(self, tid): return self.r.get(f"analysis_raw:{tid}") or "{}"

  shared.evidence_engine.py: |
    import subprocess, json, os
    def run(cmd, timeout=30):
        try: return subprocess.check_output(cmd, shell=True, text=True, stderr=subprocess.STDOUT, timeout=timeout)[:3000]
        except: return "ERROR"
    def get_previous_logs(pod, ns): return run(f"kubectl logs {pod} -n {ns} --previous --tail=100")
    def get_current_logs(pod, ns): return run(f"kubectl logs {pod} -n {ns} --tail=100")
    def get_events(ns): return run(f"kubectl get events -n {ns} --sort-by=.metadata.creationTimestamp | tail -n 20")
    def get_describe(pod, ns): return run(f"kubectl describe pod {pod} -n {ns}")
    def get_owner(pod, ns):
        res = run(f"kubectl get pod {pod} -n {ns} -o jsonpath='{{.metadata.ownerReferences[0].name}}'")
        return res if res != "ERROR" else "N/A"
    def get_yaml(owner, ns):
        if owner == "N/A": return "N/A"
        return run(f"kubectl get deployment {owner} -n {ns} -o yaml")
    def get_alertmanager_config(): return run("kubectl get secret alertmanager-kube-prometheus-stack-alertmanager -n monitoring -o yaml")
    def collect(pod, ns):
        owner = get_owner(pod, ns)
        return {
            "logs_current": get_current_logs(pod, ns),
            "logs_previous": get_previous_logs(pod, ns),
            "events": get_events(ns),
            "describe": get_describe(pod, ns),
            "controller_yaml": get_yaml(owner, ns),
            "alertmanager_config": get_alertmanager_config()
        }


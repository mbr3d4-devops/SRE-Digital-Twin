    """
    Digital Twin Orchestrator v7 - Advanced AI SRE
    ==============================================
    - Staff Doctrine: Disk-based GitOps & VSCode Integration
    """
    import http.server, socketserver, json, urllib.request, urllib.parse, time, hashlib, base64, psycopg2, ssl, datetime, logging, uuid, sys, threading, re, os, yaml, copy
    from concurrent.futures import ThreadPoolExecutor
    import redis as redis_lib
    try:
        import pika
    except ImportError:
        pika = None
    try:
        from prometheus_client import start_http_server, Counter, Histogram
    except ImportError:
        start_http_server = Counter = Histogram = None
    
    class AntigravityJSONFormatter(logging.Formatter):
        def format(self, record):
            log_record = {"timestamp": self.formatTime(record), "level": record.levelname, "agent_role": getattr(record, 'role', 'unidentified'), "operation": getattr(record, 'operation', 'idle'), "trace_id": getattr(record, 'trace_id', 'no-trace'), "message": record.getMessage()}
            if hasattr(record, 'metadata'): log_record["metadata"] = record.metadata
            return json.dumps(log_record)
    
    logger = logging.getLogger("Antigravity"); logger.setLevel(logging.INFO)
    handler = logging.StreamHandler(sys.stdout); handler.setFormatter(AntigravityJSONFormatter()); logger.addHandler(handler)
    executor = ThreadPoolExecutor(max_workers=10)
    
    WEBHOOK_CONFIG_PATH = "/etc/config/rocketchat_hooks.json"
    RC_TOKEN = ""; RC_USER_ID = ""; RC_URL = "http://rocketchat-rocketchat.communication.svc.cluster.local:80"
    
    def load_credentials():
        global RC_TOKEN, RC_USER_ID
        try:
            if os.path.exists(WEBHOOK_CONFIG_PATH):
                with open(WEBHOOK_CONFIG_PATH, "r") as f:
                    creds = json.load(f); RC_TOKEN = creds.get("RC_TOKEN", ""); RC_USER_ID = creds.get("RC_USER_ID", "")
        except: pass
    load_credentials()
    
    LM_STUDIO = "http://172.18.0.1:1234/v1/chat/completions"; LM_MODEL = "meta-llama-3.1-8b-instruct"
    ORCH_URL = "http://orchestrator.127.0.0.1.nip.io"
    GITEA_API = "http://gitea-http.gitops.svc.cluster.local:3000/api/v1/repos/marcelo/target-app-infra/contents/"
    GITEA_CREDS = base64.b64encode(b"marcelo:password123").decode()
    LOKI_URL = "http://loki-proxy.observability.svc.cluster.local:3100/loki/api/v1/query_range"
    PROM_URL = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query"
    K8S_URL = "https://kubernetes.default.svc"
    try:
        with open('/var/run/secrets/kubernetes.io/serviceaccount/token', 'r') as f: K8S_TOKEN = f.read().strip()
        CTX = ssl.create_default_context(cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')
    except: K8S_TOKEN, CTX = "", ssl._create_unverified_context()
    
    COLORS = {"ops-critical": "#FF0000", "ops-remediation": "#FFA500", "ops-security": "#7000FF", "ops-history": "#4A4A4A", "analyst": "#9C27B0", "devops": "#2196F3"}
    
    # v2.0: Redis-backed state persistence
    REDIS_HOST = os.environ.get("REDIS_HOST", "redis-state")
    try:
        rdb = redis_lib.Redis(host=REDIS_HOST, port=6379, db=0, decode_responses=True)
        rdb.ping()
        print(f"DEBUG: Redis connected at {REDIS_HOST}", flush=True)
    except Exception as e:
        print(f"WARN: Redis unavailable ({e}), falling back to in-memory", flush=True)
        rdb = None

    def state_get(collection, key):
        if rdb:
            val = rdb.hget(collection, key)
            return json.loads(val) if val else None
        return _mem.get(collection, {}).get(key)

    def state_set(collection, key, value):
        if rdb:
            rdb.hset(collection, key, json.dumps(value))
        else:
            _mem.setdefault(collection, {})[key] = value

    def state_del(collection, key):
        if rdb:
            rdb.hdel(collection, key)
        else:
            _mem.get(collection, {}).pop(key, None)

    def state_exists(collection, key):
        if rdb:
            return rdb.hexists(collection, key)
        return key in _mem.get(collection, {})

    _mem = {"pending": {}, "investigations": {}}

    # v2.0: RabbitMQ async messaging
    MQ_HOST = os.environ.get("RABBITMQ_HOST", "rabbitmq")
    MQ_USER = os.environ.get("RABBITMQ_USER", "sre")
    MQ_PASS = os.environ.get("RABBITMQ_PASS", "sre2026")
    MQ_VHOST = os.environ.get("RABBITMQ_VHOST", "sre-ops")
    MQ_QUEUE = "sre_tasks"
    mq_conn = None; mq_channel = None

    def mq_connect():
        global mq_conn, mq_channel
        if not pika:
            print("WARN: pika not installed, MQ disabled", flush=True)
            return False
        try:
            creds = pika.PlainCredentials(MQ_USER, MQ_PASS)
            params = pika.ConnectionParameters(host=MQ_HOST, virtual_host=MQ_VHOST, credentials=creds, heartbeat=600, blocked_connection_timeout=300)
            mq_conn = pika.BlockingConnection(params)
            mq_channel = mq_conn.channel()
            mq_channel.queue_declare(queue=MQ_QUEUE, durable=True)
            print(f"DEBUG: RabbitMQ connected at {MQ_HOST}/{MQ_VHOST}", flush=True)
            return True
        except Exception as e:
            print(f"WARN: RabbitMQ unavailable ({e}), falling back to sync", flush=True)
            mq_conn = None; mq_channel = None
            return False

    def mq_publish(task_data):
        global mq_conn, mq_channel
        try:
            if not mq_channel or mq_conn.is_closed:
                if not mq_connect(): return False
            mq_channel.basic_publish(
                exchange='', routing_key=MQ_QUEUE,
                body=json.dumps(task_data),
                properties=pika.BasicProperties(delivery_mode=2)
            )
            print(f"DEBUG: Task published to MQ: {task_data.get('action_id', 'N/A')}", flush=True)
            return True
        except Exception as e:
            print(f"WARN: MQ publish failed ({e}), falling back to sync", flush=True)
            mq_conn = None; mq_channel = None
            return False

    def mq_consumer_thread():
        while True:
            try:
                creds = pika.PlainCredentials(MQ_USER, MQ_PASS)
                params = pika.ConnectionParameters(host=MQ_HOST, virtual_host=MQ_VHOST, credentials=creds, heartbeat=600)
                conn = pika.BlockingConnection(params)
                ch = conn.channel()
                ch.queue_declare(queue=MQ_QUEUE, durable=True)
                ch.basic_qos(prefetch_count=1)
                print(f"DEBUG: MQ Consumer started on {MQ_QUEUE}", flush=True)
                def callback(ch, method, properties, body):
                    try:
                        task = json.loads(body)
                        print(f"DEBUG: MQ Consumer processing task {task.get('action_id', 'N/A')}", flush=True)
                        process_llm_diagnosis(task)
                        ch.basic_ack(delivery_tag=method.delivery_tag)
                    except Exception as e:
                        print(f"ERROR: MQ Consumer task failed: {e}", flush=True)
                        ch.basic_nack(delivery_tag=method.delivery_tag, requeue=True)
                ch.basic_consume(queue=MQ_QUEUE, on_message_callback=callback)
                ch.start_consuming()
            except Exception as e:
                print(f"WARN: MQ Consumer disconnected ({e}), reconnecting in 10s...", flush=True)
                time.sleep(10)

    # v2.0.1: Prometheus internal metrics
    if Counter:
        METRIC_PR_CREATED = Counter('sre_prs_created_total', 'Total PRs created by DevOps Agent')
        METRIC_ALERTS_RECEIVED = Counter('sre_alerts_received_total', 'Total alerts received by Orchestrator', ['severity', 'alertname'])
        METRIC_TASK_LATENCY = Histogram('sre_task_latency_seconds', 'Latency of SRE tasks in seconds', ['phase'])
    else:
        METRIC_PR_CREATED = METRIC_ALERTS_RECEIVED = METRIC_TASK_LATENCY = None

    if start_http_server:
        try:
            start_http_server(8000)
            print("DEBUG: Prometheus metrics server on 8000", flush=True)
        except Exception as e: print(f"WARN: Metrics server fail: {e}", flush=True)

    # Start MQ consumer in background
    mq_connect()
    if pika:
        t = threading.Thread(target=mq_consumer_thread, daemon=True)
        t.start()
    
    def send_to_rocket(agent_role, text, aliases=None, attachments=None, thread_id=None, channel_override=None):
        channels = {"orchestrator": "ops-warroom", "analyst": "ops-warroom", "devops": "ops-warroom", "warden": "ops-security", "archivist": "ops-history"}
        target_channel = channel_override if channel_override else f"#{channels.get(agent_role, 'ops-warroom')}"
        print(f"DEBUG: Rocket.Chat Sending to {target_channel} (Role: {agent_role})", flush=True)
        payload = {"text": text, "alias": aliases or agent_role.capitalize()}
        if attachments: payload["attachments"] = attachments
        if thread_id:
            payload["tmid"] = thread_id
            payload["roomId"] = target_channel
        else:
            payload["channel"] = target_channel
        
        req_data = json.dumps(payload).encode()
        print(f"DEBUG: Rocket.Chat Payload for {agent_role}: {json.dumps(payload)}", flush=True)
        
        req = urllib.request.Request(f"{RC_URL}/api/v1/chat.postMessage", data=req_data, headers={"Content-Type": "application/json", "X-Auth-Token": RC_TOKEN, "X-User-Id": RC_USER_ID})
        try:
            with urllib.request.urlopen(req, timeout=10) as r:
                res = json.loads(r.read().decode())
                if not res.get("success"):
                    print(f"DEBUG: Rocket.Chat API Error: {res}", flush=True)
                return res.get("message", {}).get("_id")
        except Exception as e:
            print(f"DEBUG: Rocket.Chat Send Exception: {e}", flush=True)
            if hasattr(e, 'read'):
                print(f"DEBUG: Rocket.Chat Error Body: {e.read().decode()}", flush=True)
            return None
    
    def query_llm(sys_p, usr_p, max_tok=600):
        req = urllib.request.Request(LM_STUDIO, data=json.dumps({"model": LM_MODEL, "messages": [{"role": "system", "content": sys_p}, {"role": "user", "content": usr_p}], "temperature": 0.2, "max_tokens": max_tok}).encode(), headers={"Content-Type": "application/json"})
        try:
            with urllib.request.urlopen(req, timeout=120) as r: return json.loads(r.read().decode())["choices"][0]["message"]["content"], LM_MODEL
        except: return "LLM Error", "offline"
    
    def k8s_request(method, path, body=None):
        req = urllib.request.Request(K8S_URL + path, data=json.dumps(body).encode() if body else None, method=method, headers={"Authorization": "Bearer " + K8S_TOKEN, "Content-Type": "application/json"})
        try:
            with urllib.request.urlopen(req, context=CTX, timeout=10) as r: return r.getcode(), json.loads(r.read().decode())
        except: return 500, {}
    
    def query_loki(app):
        u = f"{LOKI_URL}?query={{pod=~'.*{app}.*'}}&limit=10"
        try:
            with urllib.request.urlopen(u) as r:
                res = json.loads(r.read().decode()); logs = []
                for s in res["data"]["result"]:
                    for v in s["values"]: logs.append(v[1])
                return "\n".join(logs[-10:])
        except: return "Loki Error"
    
    def query_prometheus(app):
        u_cpu = f"{PROM_URL}?query=sum(rate(container_cpu_usage_seconds_total{{pod=~'.*{app}.*'}}[5m]))"
        u_mem = f"{PROM_URL}?query=sum(container_memory_usage_bytes{{pod=~'.*{app}.*'}})"
        try:
            with urllib.request.urlopen(u_cpu) as r:
                res = json.loads(r.read().decode())
                v_cpu = res["data"]["result"][0]["value"][1] if res["data"]["result"] else "0"
            with urllib.request.urlopen(u_mem) as r:
                res = json.loads(r.read().decode())
                v_mem = res["data"]["result"][0]["value"][1] if res["data"]["result"] else "0"
            return f"CPU: {float(v_cpu):.4f} cores, RAM: {int(float(v_mem))/1024/1024:.2f} Mi"
        except: return "Prom Error"
    
    def wait_for_resource_health(deploy, ns, timeout=120):
        t_end = time.time() + timeout
        while time.time() < t_end:
            c, o = k8s_request("GET", f"/apis/apps/v1/namespaces/{ns}/deployments/{deploy}")
            if c == 200:
                s = o.get("status", {}); av = s.get("availableReplicas", 0); rep = o.get("spec", {}).get("replicas", 1)
                if av >= rep: return True, "Healthy"
            time.sleep(10)
        return False, "Timeout"
    
    def archivist_postmortem(action, action_id, trace_id, thread_id):
        a = action["alert"]; l = a.get("labels", {}); alertname = l.get("alertname", ""); ns = action["ns"]; deploy = action["deploy"]
        healthy, _ = wait_for_resource_health(deploy, ns)
        if not healthy: 
            inv_key = f"{ns}/{deploy}"
            if state_get("investigations", inv_key) == trace_id: state_del("investigations", inv_key)
            return
        mttr = "N/A"
        try:
            st = datetime.datetime.fromisoformat(a.get("startsAt", "").replace("Z", "+00:00"))
            en = datetime.datetime.now(datetime.timezone.utc); mttr = f"{(en-st).total_seconds()/60:.1f} min"
        except: pass
        md, _ = query_llm("SRE Post-Mortem Writer.", f"Incident: {alertname} in {deploy}\nDiag: {action['diag']}\nFix: {action['desc']}\nMTTR: {mttr}", 800)
        fn = f"postmortems/{datetime.datetime.now().strftime('%Y-%m-%d-%H-%M')}-{alertname}.md"
        body = {"content": base64.b64encode(md.encode()).decode(), "message": "PM Archive", "branch": "main"}
        try: urllib.request.urlopen(urllib.request.Request(GITEA_API+fn, data=json.dumps(body).encode(), headers={"Authorization": "Basic "+GITEA_CREDS, "Content-Type": "application/json"}))
        except: pass
        inv_key = f"{ns}/{deploy}"
        if state_get("investigations", inv_key) == trace_id: state_del("investigations", inv_key)

    def clean_manifest(man):
        m = copy.deepcopy(man)
        m.pop("status", None)
        meta = m.get("metadata", {})
        for k in ["creationTimestamp", "resourceVersion", "uid", "generation", "managedFields"]:
            meta.pop(k, None)
        return m

    def workflow_critical(alert):
        try:
            print(f"DEBUG: [START] workflow_critical for {alert.get('labels',{}).get('alertname')}", flush=True)
            trace_id = str(uuid.uuid4()); l = alert.get("labels", {}); severity = l.get("severity", "critical")
            ns, pod, alertname = l.get("namespace", "N/A"), l.get("pod", "N/A"), l.get("alertname", "Unknown")
            
            if METRIC_ALERTS_RECEIVED: 
                try: METRIC_ALERTS_RECEIVED.labels(severity=severity, alertname=alertname).inc()
                except Exception as me: print(f"DEBUG: Metric Error: {me}", flush=True)
            
            deploy = l.get("deployment")
            if not deploy:
                if pod.count("-") >= 2: deploy = "-".join(pod.split("-")[:-2])
                else: deploy = pod.split("-")[0] if "-" in pod else pod
            
            inv_key = f"{ns}/{deploy}"; channel = "#ops-warroom" if severity == "critical" or alertname == "KubePodCrashLooping" else "#ops-logs"
            print(f"DEBUG: Checking investigation for {inv_key}", flush=True)
            if state_exists("investigations", inv_key): 
                print(f"DEBUG: Alert {inv_key} already in active_investigations", flush=True)
                return
            
            state_set("investigations", inv_key, trace_id)
            print(f"DEBUG: Sending initial alert to RC thread...", flush=True)
            tid = send_to_rocket("orchestrator", f"🚨 **{severity.upper()}:** {alertname}\nNS: `{ns}` | Pod: `{pod}`", channel_override=channel)
            print(f"DEBUG: RC Thread ID: {tid}", flush=True)
        except Exception as e:
            print(f"ERROR in workflow_critical: {e}", flush=True)
            import traceback; traceback.print_exc()
            return
        
        # Phase 1: Gather evidence (fast)
        print(f"DEBUG: Querying Loki and Prometheus for {deploy}...", flush=True)
        logs = query_loki(deploy); metrics = query_prometheus(deploy)
        print(f"DEBUG: Querying K8s manifest for {deploy} in {ns}...", flush=True)
        c, manifest = k8s_request("GET", f"/apis/apps/v1/namespaces/{ns}/deployments/{deploy}")
        
        rel_pm = []
        try:
            pm_list = os.listdir("/repo/postmortems")
            print(f"DEBUG: Scanning /repo/postmortems: {pm_list}", flush=True)
            rel_pm = [f for f in pm_list if deploy.lower() in f.lower() or alertname.lower() in f.lower()]
            print(f"DEBUG: Matches found: {rel_pm}", flush=True)
        except Exception as e: print(f"DEBUG: PM Scan Error: {e}", flush=True)

        action_id = hashlib.md5((alertname+ns+pod+str(time.time())).encode()).hexdigest()[:12]
        
        # Phase 2: Publish to MQ or fallback to sync
        task_payload = {
            "action_id": action_id, "alert": alert, "trace_id": trace_id,
            "ns": ns, "pod": pod, "deploy": deploy, "alertname": alertname,
            "severity": severity, "channel": channel, "thread_id": tid,
            "logs": logs[:2000], "metrics": metrics, "manifest": manifest,
            "rel_pm": rel_pm
        }
        
        if mq_publish(task_payload):
            send_to_rocket("orchestrator", "⏳ Diagnóstico enfileirado (async via MQ)...", thread_id=tid, channel_override=channel)
            print(f"DEBUG: Task {action_id} published to MQ, returning immediately", flush=True)
        else:
            print(f"DEBUG: MQ unavailable, processing synchronously", flush=True)
            process_llm_diagnosis(task_payload)

    def process_llm_diagnosis(task):
        action_id = task["action_id"]; alert = task["alert"]; trace_id = task["trace_id"]
        ns = task["ns"]; pod = task["pod"]; deploy = task["deploy"]
        alertname = task["alertname"]; severity = task["severity"]
        channel = task["channel"]; tid = task["thread_id"]
        logs = task["logs"]; metrics = task["metrics"]; manifest = task["manifest"]
        rel_pm = task["rel_pm"]
        
        print(f"DEBUG: Processing LLM diagnosis for {action_id}...", flush=True)
        pm_files = ", ".join(rel_pm) if rel_pm else "Nenhum encontrado"
        current_res = json.dumps(manifest.get('spec', {}).get('template', {}).get('spec', {}).get('containers', [{}])[0].get('resources', {}), indent=2)
        
        sys_p = f"""Você é o SRE Analyst da Digital Twin. RESPOSTA EM PORTUGUÊS (BRASIL).
        Siga este formato Markdown RIGOROSAMENTE:
        1. **Resumo do Incidente**: O que está acontecendo e impacto.
        2. **Evidências Técnicas**: 
           - **Logs do Loki**:
           ```text
           {logs[:800].replace('`', "'")}
           ```
           - **Métricas Prometheus**: {metrics}
        3. **Análise de Causa Raiz**: O porquê técnico (ex: OOM, Limits).
        4. **Contexto Histórico**: Postmortems relacionados: {pm_files}.
        5. **Sugestão de Correção**:
           - **Trecho Atual (YAML)**:
           ```yaml
           {current_res}
           ```
           - **Trecho Sugerido (YAML)**:
           ```yaml
           resources:
             limits:
               memory: "128Mi"
               cpu: "100m"
           ```
        """
        diag, _ = query_llm(sys_p, f"Incident: {alertname} in {deploy}. Respond in Portuguese.", 1000)
        print(f"DEBUG: LLM Diag received for {action_id}", flush=True)
        send_to_rocket("analyst", f"🔍 **Diagnóstico Detalhado**\n{diag}", thread_id=tid, channel_override=channel)
        
        fix_desc = "Rollout Restart"
        m = re.search(r"FIX_SUGGESTION\s*[:*]+\s*(.*)", diag, re.I)
        if m: fix_desc = m.group(1).split('\n')[0].strip()
        
        try:
            yaml_match = re.search(r"Trecho Sugerido \(YAML\).*?```yaml\n(.*?)\n```", diag, re.DOTALL | re.IGNORECASE)
            if yaml_match:
                suggested_res = yaml.safe_load(yaml_match.group(1))
                if getattr(suggested_res, "get", None) and "resources" in suggested_res:
                    for container in manifest.get("spec", {}).get("template", {}).get("spec", {}).get("containers", []):
                        container["resources"] = suggested_res["resources"]
                    if fix_desc == "Rollout Restart": fix_desc = "Ajuste de resources limits recomendado pelo Analyst"
                    print(f"DEBUG: Applied LLM resources patch to manifest", flush=True)
        except Exception as e:
            print(f"WARN: Failed to parse suggested YAML: {e}", flush=True)
        
        if "cache-engine" in deploy and ("invalid-config-flag" in diag.lower() or "--invalid-config-flag-test" in diag):
            print(f"DEBUG: Detected invalid flag in Redis, applying fix to manifest", flush=True)
            for container in manifest["spec"]["template"]["spec"]["containers"]:
                if "args" in container: container["args"] = [a for a in container["args"] if a != "--invalid-config-flag-test"]
            fix_desc = "Removendo flag inválida do Redis"
            
        manifest.setdefault("spec", {}).setdefault("template", {}).setdefault("metadata", {}).setdefault("annotations", {})["restartedAt"] = str(time.time())
        path = f"app/{deploy}.yaml" if deploy in ["api-gateway", "cache-engine"] else f"app-production/{deploy}.yaml" if ns == "app-production" else f"namespaces/{ns}/{deploy}/deployment.yaml"
        vscode_link = f"vscode://file/home/marcelo/lab-infra-repo/manifests/{path}"
        gitea_link = f"http://gitea.127.0.0.1.nip.io:3000/marcelo/target-app-infra/src/branch/main/manifests/{path}"
        
        clean_man = clean_manifest(manifest)
        action_data = {"alert": alert, "manifest_str": yaml.dump(clean_man, default_flow_style=False), "deploy": deploy, "ns": ns, "desc": fix_desc, "diag": diag, "trace_id": trace_id, "thread_id": tid, "file_path": path, "channel": channel, "status": "pending"}
        state_set("pending", action_id, action_data)
        print(f"DEBUG: Sending DevOps patch Proposal {action_id}...", flush=True)
        
        fix_text = f"🛠️ **GitOps Patch: {action_id}**\nSolução: {fix_desc}\n[🔍 Abrir no VSCode]({vscode_link})"
        send_to_rocket("devops", fix_text, attachments=[{"actions": [{"type": "button", "text": "✅ Aprovar", "url": ORCH_URL+"/approve?id="+action_id}, {"type": "button", "text": "🌐 Ver no Git", "url": gitea_link}, {"type": "button", "text": "❌ Rejeitar", "url": ORCH_URL+"/reject?id="+action_id}]}], thread_id=tid, channel_override=channel)
        print(f"DEBUG: process_llm_diagnosis completed for {action_id}", flush=True)

    def handle_approve(action_id):
        a = state_get("pending", action_id)
        if not a: return "Invalid"
        if a["status"] != "pending": return "Processed"
        a["status"] = "approved"
        state_set("pending", action_id, a)
        
        import subprocess
        GITEA_HTTP = "http://marcelo:password123@gitea-http.gitops.svc.cluster.local:3000/marcelo/target-app-infra.git"
        GITEA_API_BASE = "http://gitea-http.gitops.svc.cluster.local:3000/api/v1/repos/marcelo/target-app-infra"
        branch_name = f"fix/{action_id}"
        full_path = f"/repo/manifests/{a['file_path']}"
        
        try:
            # 1. Setup Git
            for cmd in [
                ["git", "config", "--global", "user.email", "devops@sre.com"],
                ["git", "config", "--global", "user.name", "AI DevOps"],
                ["git", "config", "--global", "safe.directory", "/repo"],
            ]: subprocess.run(cmd, cwd="/repo", capture_output=True)
            
            # 2. Reset to main and create fix branch
            subprocess.run(["git", "checkout", "main"], cwd="/repo", capture_output=True)
            subprocess.run(["git", "pull", GITEA_HTTP, "main"], cwd="/repo", capture_output=True)
            subprocess.run(["git", "checkout", "-b", branch_name], cwd="/repo", capture_output=True)
            
            # 3. Write manifest and commit
            print(f"DEBUG: Writing fix to {full_path}", flush=True)
            os.makedirs(os.path.dirname(full_path), exist_ok=True)
            with open(full_path, 'w') as f:
                f.write(a["manifest_str"])
            subprocess.run(["git", "add", "."], cwd="/repo", capture_output=True)
            subprocess.run(["git", "commit", "-m", f"fix({a['deploy']}): {a['desc']}"], cwd="/repo", capture_output=True)
            
            # 4. Push branch to Gitea
            result = subprocess.run(["git", "push", GITEA_HTTP, branch_name], cwd="/repo", capture_output=True)
            if result.returncode != 0:
                print(f"DEBUG: Push Error: {result.stderr.decode()}", flush=True)
                send_to_rocket("devops", "❌ **ERRO:** Push da branch falhou.", thread_id=a["thread_id"], channel_override=a["channel"])
                subprocess.run(["git", "checkout", "main"], cwd="/repo", capture_output=True)
                subprocess.run(["git", "branch", "-D", branch_name], cwd="/repo", capture_output=True)
                return "Error"
            print(f"DEBUG: Branch {branch_name} pushed", flush=True)
            
            # 5. Create Pull Request via Gitea API
            start_t = time.time()
            pr_body = {"title": f"fix({a['deploy']}): {a['desc']}", "head": branch_name, "base": "main", "body": f"Correção automática pelo SRE DevOps Agent.\n\n**Alert:** {a['alert'].get('labels',{}).get('alertname','N/A')}\n**Diagnóstico:** {a['desc']}\n**Action ID:** {action_id}"}
            pr_req = urllib.request.Request(f"{GITEA_API_BASE}/pulls", data=json.dumps(pr_body).encode(), headers={"Authorization": "Basic " + GITEA_CREDS, "Content-Type": "application/json"})
            with urllib.request.urlopen(pr_req, timeout=15) as r:
                pr_data = json.loads(r.read().decode())
                pr_number = pr_data["number"]
                pr_url = pr_data["html_url"]
            if METRIC_TASK_LATENCY: METRIC_TASK_LATENCY.labels(phase="pr_creation").observe(time.time() - start_t)
            if METRIC_PR_CREATED: METRIC_PR_CREATED.inc()
            print(f"DEBUG: PR #{pr_number} created: {pr_url}", flush=True)
            
            # 6. Notify Rocket.Chat with PR link
            send_to_rocket("devops", f"📋 **Pull Request #{pr_number}** criado\n[🔗 Ver no Gitea]({pr_url.replace('gitea-http.gitops.svc.cluster.local:3000', 'gitea.127.0.0.1.nip.io:3000')})", thread_id=a["thread_id"], channel_override=a["channel"])
            
            # 7. Auto-merge the PR
            merge_body = {"Do": "merge", "merge_message_field": f"Merge fix({a['deploy']}): {a['desc']}"}
            merge_req = urllib.request.Request(f"{GITEA_API_BASE}/pulls/{pr_number}/merge", data=json.dumps(merge_body).encode(), headers={"Authorization": "Basic " + GITEA_CREDS, "Content-Type": "application/json"}, method="POST")
            urllib.request.urlopen(merge_req, timeout=15)
            print(f"DEBUG: PR #{pr_number} merged", flush=True)
            
            # 8. Cleanup: switch back to main and delete local branch
            subprocess.run(["git", "checkout", "main"], cwd="/repo", capture_output=True)
            subprocess.run(["git", "pull", GITEA_HTTP, "main"], cwd="/repo", capture_output=True)
            subprocess.run(["git", "branch", "-D", branch_name], cwd="/repo", capture_output=True)
            
            # 9. Delete remote branch
            try:
                del_req = urllib.request.Request(f"{GITEA_API_BASE}/branches/{branch_name}", headers={"Authorization": "Basic " + GITEA_CREDS}, method="DELETE")
                urllib.request.urlopen(del_req, timeout=10)
            except: pass
            
            send_to_rocket("devops", f"🟢 **Merged & Sincronizado via GitOps (PR #{pr_number})**", thread_id=a["thread_id"], channel_override=a["channel"])
            executor.submit(archivist_postmortem, a, action_id, a["trace_id"], a["thread_id"])
            return "Success"
        except Exception as e: 
            print(f"DEBUG: PR Workflow Error: {e}", flush=True)
            subprocess.run(["git", "checkout", "main"], cwd="/repo", capture_output=True)
            try: subprocess.run(["git", "branch", "-D", branch_name], cwd="/repo", capture_output=True)
            except: pass
            send_to_rocket("devops", f"❌ **ERRO no PR Workflow:** {str(e)[:200]}", thread_id=a["thread_id"], channel_override=a["channel"])
            return "Error"


    def handle_reject(action_id):
        a = state_get("pending", action_id)
        if a:
            a["status"] = "rejected"
            state_set("pending", action_id, a)
            send_to_rocket("devops", "🔴 **Rejeitado**", thread_id=a["thread_id"], channel_override=a["channel"])
            inv_key = f"{a['ns']}/{a['deploy']}"
            if state_get("investigations", inv_key) == a["trace_id"]: state_del("investigations", inv_key)
        return "Rejected"

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_POST(self):
            try:
                d = json.loads(self.rfile.read(int(self.headers["Content-Length"])).decode())
                print(f"DEBUG: POST received with {len(d.get('alerts',[]))} alerts", flush=True)
                for a in d.get("alerts", []):
                    l = a.get("labels", {}); alertname = l.get("alertname", ""); severity = l.get("severity", "unknown")
                    if a.get("status") == "resolved":
                        channel = "#ops-warroom" if severity == "critical" or alertname == "KubePodCrashLooping" else "#ops-logs"
                        send_to_rocket("orchestrator", f"🟢 **INCIDENTE RESOLVIDO:** {alertname}\nO sistema estabilizou.", channel_override=channel)
                        continue
                    print(f"DEBUG: Routing alert {alertname} ({severity})", flush=True)
                    if severity == "critical" or "Watchdog" in alertname or alertname == "KubePodCrashLooping": executor.submit(workflow_critical, a)
                    else: send_to_rocket("analyst", f"⚠️ **Monitoramento:** {alertname}", channel_override="#ops-logs")
                self.send_response(200); self.end_headers(); self.wfile.write(b"OK")
            except Exception as e:
                print(f"ERROR in do_POST: {e}", flush=True)
                self.send_response(500); self.end_headers()
        def do_GET(self):
            p = urllib.parse.urlparse(self.path); q = urllib.parse.parse_qs(p.query); aid = q.get("id", [""])[0]
            h = "OK"
            if p.path == "/approve": h = handle_approve(aid)
            elif p.path == "/reject": h = handle_reject(aid)
            self.send_response(200); self.end_headers(); self.wfile.write(h.encode())

    print("Orchestrator v7.5 Staff Online on 8080"); socketserver.TCPServer.allow_reuse_address = True
    httpd = socketserver.TCPServer(("", 8080), Handler); httpd.serve_forever()

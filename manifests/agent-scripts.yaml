    import json
    def safe_llm(call_fn, agent_name, payload, tid):
        try:
            out = call_fn(agent_name, payload, trace_id=tid)
            if not out or len(out) < 20 or '"error":' in out: return None
            return out
        except: return None

  shared.patterns.py: |
    def detect_crashloop(evidence):
        desc = evidence.get("describe", "")
        logs_prev = evidence.get("logs_previous", "")
        if "Back-off restarting failed container" in desc: return True
        if "exit code 1" in logs_prev or "Error" in logs_prev: return True
        return False

  shared.forensic_renderer.py: |
    def render(d, e):
        # Concatena análise da LLM com as evidências brutas (Ground Truth)
        if not isinstance(d, dict): return d
        inc = d.get("incident", {})
        chain = d.get("causal_chain", [])
        chain_str = "\n".join([f"- **{c.get('symptom')}** → {c.get('failed_component')} ({c.get('failing_layer')}): {c.get('causal_trigger')}" for c in chain])
        out = f"🧠 STAFF SRE FORENSIC REPORT | {inc.get('severity', 'CRITICAL')}\n"
        out += "────────────────────────────────────────\n"
        out += f"\n**Incident:** {inc.get('name')}\n**Summary:** {d.get('executive_summary')}\n\n**Causal Chain:**\n{chain_str}\n"
        out += f"\n**Root Cause:** {d.get('root_cause')}\n**Action:** {d.get('recommended_action')}\n"
        out += "\n\n🔍 **CAUSAL EVIDENCE (GROUND TRUTH)**\n"
        out += f"```log\n[CURRENT LOGS]\n{e.get('logs_current', 'N/A')[:500]}...\n\n[PREVIOUS LOGS]\n{e.get('logs_previous', 'N/A')[:500]}...\n```"
        return out.strip()

  runtime.llm_gateway.py: |
    import json, urllib.request, re, os
    def clean_output(text):
        if not text: return '{"error": "EMPTY_LLM_RESPONSE"}'
        text = text.strip()
        text = re.sub(r"```json", "", text, flags=re.IGNORECASE)
        text = re.sub(r"```", "", text); text = text.strip()
        start = text.find("{"); end = text.rfind("}")
        if start != -1 and end != -1 and end > start:
            candidate = text[start:end+1]
            try: json.loads(candidate); return candidate
            except: pass
        return '{"error": "AI_OUTPUT_CONTAMINATED"}'
    def call_llm(agent_name, user_data, trace_id="global"):
        try:
            gov = ""
            if os.path.exists("/etc/ai-ops/governance"):
                for f in os.listdir("/etc/ai-ops/governance"):
                    with open(os.path.join("/etc/ai-ops/governance", f), "r") as r: gov += r.read() + "\n"
            with open(f"/etc/ai-ops/agents/{agent_name}/skill.md", "r") as f: skill = f.read()
            payload = {
                "model": "qwen2.5-7b-instruct",
                "messages": [
                    {"role": "system", "content": f"{gov}\n{skill}\nCONTRATO: Responda APENAS JSON. Proibido introduções."},
                    {"role": "user", "content": f"INPUT ({trace_id}):\n{user_data}\n\nResponda estritamente em JSON:"}
                ],
                "temperature": 0.0, "max_tokens": 2000
            }
            url = os.environ.get("LLM_URL", "http://172.18.0.1:1234/v1/chat/completions")
            req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"})
            with urllib.request.urlopen(req, timeout=120) as res:
                return clean_output(json.loads(res.read())["choices"][0]["message"]["content"])
        except Exception as e: return json.dumps({"error": "LLM_GATEWAY_FAILURE", "agent": agent_name, "details": str(e)})

  runtime.messaging.py: |
    import os, json, time, pika, urllib.request
    def get_mq_conn():
        creds = pika.PlainCredentials(os.environ.get('RABBITMQ_USER', 'sre'), os.environ.get('RABBITMQ_PASS', 'sre2026'))
        return pika.BlockingConnection(pika.ConnectionParameters(host=os.environ.get('RABBITMQ_HOST', 'rabbitmq'), virtual_host='sre-ops', credentials=creds))
    def send_to_rocket(role, text, tmid=None):
        alias_map = {"orchestrator": "Orchestrator", "analyst": "Analyst Forensic", "warden": "The Warden", "auditor": "Auditor SLA"}
        colors = {"orchestrator": "#D32F2F", "analyst": "#4A148C", "warden": "#1B1E21", "auditor": "#2E7D32"}
        safe_text = text.encode('utf-8', 'ignore').decode('utf-8')
        if len(safe_text) > 4000: safe_text = safe_text[:4000] + "..."
        payload = {"roomId": "699b26601cf126f19882ef8d", "text": safe_text, "alias": alias_map.get(role, "Agente SRE"), "attachments": [{"color": colors.get(role, "#555555"), "ts": time.time()}]}
        if tmid: payload["tmid"] = tmid
        try:
            req = urllib.request.Request(f"{os.environ['RC_URL']}/api/v1/chat.postMessage", data=json.dumps(payload).encode(),
                headers={"X-Auth-Token": os.environ['RC_TOKEN'], "X-User-Id": os.environ['RC_USER_ID'], "Content-Type": "application/json"})
            with urllib.request.urlopen(req, timeout=10) as res: return json.loads(res.read())["message"]["_id"]
        except: return None

  runtime.orchestrator.py: |
    import json, os, uuid, sys; sys.path.append('/etc/ai-ops/scripts')
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from runtime.messaging import get_mq_conn, send_to_rocket
    from shared.thread_manager import ThreadManager
    from shared.incident_state import IncidentState
    class WebhookHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/health': self.send_response(200); self.end_headers(); self.wfile.write(b'OK')
            else: self.send_response(404); self.end_headers()
        def do_POST(self):
            data = json.loads(self.rfile.read(int(self.headers['Content-Length'])).decode())
            tm = ThreadManager()
            for alert in data.get('alerts', []):
                if alert.get('status') == 'resolved': continue
                fp = alert.get("fingerprint")
                if fp:
                    current_state = tm.r.get(f"state_fp:{fp}")
                    if current_state and current_state != IncidentState.RESOLVED: continue
                    tm.r.set(f"state_fp:{fp}", IncidentState.OPEN, ex=86400)
                
                tid = str(uuid.uuid4())[:8]; labels = alert.get('labels', {})
                tm.set_state(tid, IncidentState.OPEN)
                with open("/etc/ai-ops/agents/orchestrator/skill.md", "r") as f: template = f.read()
                msg = template.format(alertname=labels.get('alertname', 'Alerta'), pod=labels.get('pod', 'N/A'), ns=labels.get('namespace', 'N/A'), summary=alert.get('annotations', {}).get('summary', 'Sem sumário'), trace_id=tid)
                msg_id = send_to_rocket("orchestrator", msg)
                if msg_id:
                    tm.set_thread(tid, msg_id)
                    if fp: tm.r.set(f"thread_fp:{fp}", msg_id, ex=86400)
                tm.save_evidence(tid, json.dumps(alert))
                conn = get_mq_conn(); ch = conn.channel()
                ch.queue_declare(queue='sre_tasks', durable=True); ch.basic_publish(exchange='', routing_key='sre_tasks', body=json.dumps({"trace_id": tid, "thread_id": msg_id, "fp": fp}))
                conn.close()
            self.send_response(200); self.end_headers()
    if __name__ == "__main__": HTTPServer(('0.0.0.0', 8080), WebhookHandler).serve_forever()

  runtime.analyst.py: |
    import json, os, pika, sys; sys.path.append('/etc/ai-ops/scripts')
    from runtime.messaging import get_mq_conn, send_to_rocket
    from shared.thread_manager import ThreadManager
    from shared.incident_state import IncidentState
    from shared.evidence_engine import collect
    from shared.llm_guard import safe_llm
    from shared.patterns import detect_crashloop
    from shared.forensic_renderer import render
    from runtime.llm_gateway import call_llm
    def callback(ch, method, props, body):
        try:
            ctx = json.loads(body.decode()); tid = ctx.get('trace_id', 'unknown'); fp = ctx.get('fp'); tm = ThreadManager()
            tmid = ctx.get('thread_id') or tm.get_thread(tid); alert = json.loads(tm.get_evidence(tid))
            pod = alert.get('labels', {}).get('pod', 'N/A'); ns = alert.get('labels', {}).get('namespace', 'default')
            
            tm.set_state(tid, IncidentState.EVIDENCE_COLLECTION)
            evidence = collect(pod, ns)
            
            if "ERROR" in str(evidence):
                tm.set_state(tid, IncidentState.EVIDENCE_FAILED)
                send_to_rocket("analyst", "❌ Falha na coleta de evidências forenses.", tmid=tmid)
                ch.basic_ack(delivery_tag=method.delivery_tag); return
            
            tm.set_evidence(tid, evidence)
            tm.set_state(tid, IncidentState.ANALYZING)
            
            if detect_crashloop(evidence): tm.set_state(tid, IncidentState.ROOT_CAUSED)
            
            raw_ai = safe_llm(call_llm, "analyst", json.dumps(evidence), tid)
            if not raw_ai:
                tm.set_state(tid, IncidentState.LLM_FAILED)
                send_to_rocket("analyst", "⚠️ Falha crítica na análise de IA (Gateway Timeout/Error).", tmid=tmid)
                ch.basic_ack(delivery_tag=method.delivery_tag); return
            
            try: laudo_dict = json.loads(raw_ai); laudo = render(laudo_dict, evidence)
            except: laudo = raw_ai
            
            send_to_rocket("analyst", laudo, tmid=tmid); tm.save_analysis(tid, laudo); tm.save_analysis_raw(tid, raw_ai)
            conn = get_mq_conn(); ch_out = conn.channel(); ch_out.queue_declare(queue='sre_warden', durable=True)
            ch_out.basic_publish(exchange='', routing_key='sre_warden', body=json.dumps(ctx)); conn.close(); ch.basic_ack(delivery_tag=method.delivery_tag)
        except Exception as e: print(f"Error: {e}"); ch.basic_nack(delivery_tag=method.delivery_tag, requeue=True)
    if __name__ == "__main__":
        ch = get_mq_conn().channel(); ch.queue_declare(queue='sre_tasks', durable=True); ch.basic_consume(queue='sre_tasks', on_message_callback=callback); ch.start_consuming()

  runtime.warden.py: |
    import json, os, pika, sys; sys.path.append('/etc/ai-ops/scripts')
    from runtime.messaging import get_mq_conn, send_to_rocket
    from shared.thread_manager import ThreadManager
    from shared.incident_state import IncidentState
    from runtime.llm_gateway import call_llm
    def callback(ch, method, props, body):
        try:
            ctx = json.loads(body.decode()); tid = ctx['trace_id']; tm = ThreadManager()
            tm.set_state(tid, IncidentState.AUDITING if hasattr(IncidentState, 'AUDITING') else "AUDITING")
            evidence = tm.get_evidence(tid)
            payload = {"analysis": tm.get_analysis_raw(tid), "ground_truth": evidence}
            raw_ai = call_llm("warden", json.dumps(payload), trace_id=tid)
            try: data = json.loads(raw_ai); veredito = data.get('veredito', 'REPROVADO').upper(); justificativa = data.get('justificativa', raw_ai)
            except: veredito = "REPROVADO"; justificativa = raw_ai
            send_to_rocket("warden", justificativa, tmid=tm.get_thread(tid))
            if veredito == "APROVADO":
                conn = get_mq_conn(); ch_out = conn.channel(); ch_out.queue_declare(queue='sre_audit', durable=True)
                ch_out.basic_publish(exchange='', routing_key='sre_audit', body=json.dumps(ctx)); conn.close()
            ch.basic_ack(delivery_tag=method.delivery_tag)
        except Exception as e: print(f"Error: {e}"); ch.basic_nack(delivery_tag=method.delivery_tag, requeue=True)
    if __name__ == "__main__":
        ch = get_mq_conn().channel(); ch.queue_declare(queue='sre_warden', durable=True); ch.basic_consume(queue='sre_warden', on_message_callback=callback); ch.start_consuming()

